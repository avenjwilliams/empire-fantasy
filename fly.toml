app = 'empire-fantasy'
primary_region = 'ord'

[build]

[env]
  NODE_ENV = 'production'
  DATABASE_PATH = '/data/empire-fantasy.db'
  DATA_DIR = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = 'ef_data'
  destination = '/data'
